version: "3.8"

services:
  nextjs:
    build:
      context: ./docker/nextjs
      dockerfile: Dockerfile
    ports:
      - "3008:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules # コンテナ内のnode_modulesを保持
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev"

